name: Manual Multi-Environment Deployment

on:
    workflow_dispatch:
        inputs:
            target_environment:
                description: 'Environment to deploy to'
                required: true
                type: choice
                options:
                    - dev
                    - test
                    - staging
                    - prod
            subscription_tag:
                description: 'Subscription tag for the deployment'
                required: true
                type: choice
                options:
                    - dev
                    - ptl
                    - prod

permissions:
    contents: read

jobs:
    validate:
        uses: ./.github/workflows/validate.yml
        with:
            target_environment: ${{ inputs.target_environment }}
            subscription_tag: ${{ inputs.subscription_tag }}

    deploy:
        needs: validate
        uses: ./.github/workflows/deploy.yml
        with:
            target_environment: ${{ inputs.target_environment }}
            subscription_tag: ${{ inputs.subscription_tag }}
